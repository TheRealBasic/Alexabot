name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run formatting check
        run: npm run format:check

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.log

      - name: Extract coverage summary
        if: always()
        shell: bash
        run: |
          awk '/^# start of coverage report/{flag=1} flag {print} /^# end of coverage report/{flag=0}' test-output.log > coverage-summary.txt

      - name: Upload test and coverage summary log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-log-node-${{ matrix.node-version }}
          path: |
            test-output.log
            coverage-summary.txt
          if-no-files-found: error

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EIDOLON OS // Recovery Image</title>
  <style>
    :root {
      --bg: #071019;
      --panel: #0e1d2b;
      --line: #21405f;
      --text: #c7d8eb;
      --muted: #7b90a9;
      --warning: #d7ac66;
      --danger: #d46969;
      --accent: #6ba2d9;
      --taskbar: rgba(3, 8, 14, 0.9);
      --shadow: 0 8px 24px rgba(0,0,0,0.45);
      --font: "Tahoma", "Segoe UI", sans-serif;
      --mono: "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: var(--font); }

    #boot, #desktopRoot, #login {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #boot {
      background: #000;
      color: #87bf8f;
      font-family: var(--mono);
      padding: 14px;
      font-size: 14px;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
    }

    #boot pre {
      margin: 0;
      white-space: pre-wrap;
      flex: 1;
      overflow: hidden;
    }

    .scanline::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        rgba(255,255,255,0.02),
        rgba(255,255,255,0.02) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    #splash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, #1f3348, #04080d 70%);
      color: #c9d7e7;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    #splash h1 { margin: 0; font-weight: 500; font-size: 38px; }
    #splash p { margin-top: 8px; color: #7e90a5; }

    #login {
      display: none;
      background: linear-gradient(130deg, #0b1520, #0a1f31 60%, #0a101a);
      color: #d2dfeb;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }

    #login .card {
      width: 340px;
      background: rgba(5,10,18,0.9);
      border: 1px solid #294564;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    #login button {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      background: #17324b;
      border: 1px solid #2e5072;
      color: #cad9ea;
      cursor: pointer;
    }

    #desktopRoot {
      display: none;
      background: radial-gradient(circle at 20% 20%, #15273a, #081119 75%);
      color: var(--text);
      position: relative;
      user-select: none;
    }

    .desktop-icons {
      position: absolute;
      left: 10px;
      top: 10px;
      display: grid;
      gap: 12px;
      z-index: 3;
    }

    .icon {
      width: 90px;
      text-align: center;
      font-size: 12px;
      color: #d2dfed;
      cursor: pointer;
    }

    .icon .glyph {
      width: 34px;
      height: 30px;
      margin: 0 auto 6px;
      border: 1px solid #4a6b89;
      background: rgba(255,255,255,0.04);
      display: grid;
      place-items: center;
      font-size: 17px;
    }

    .taskbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34px;
      background: var(--taskbar);
      border-top: 1px solid #284764;
      display: flex;
      align-items: center;
      z-index: 40;
      font-size: 12px;
    }

    .start-btn {
      margin: 0 8px;
      height: 26px;
      min-width: 70px;
      border: 1px solid #31597e;
      background: #0d2235;
      color: #d7e6f2;
      cursor: pointer;
    }

    .tasklist { flex: 1; display: flex; gap: 4px; overflow: hidden; }
    .task { border: 1px solid #2f5478; background: #10263a; color: #d7e4ef; padding: 4px 8px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tray { display: flex; align-items: center; gap: 10px; padding: 0 10px; color: #a9bdd3; }

    .start-menu {
      position: absolute;
      left: 8px;
      bottom: 37px;
      width: 220px;
      background: #081421;
      border: 1px solid #2d506f;
      display: none;
      z-index: 45;
      box-shadow: var(--shadow);
    }

    .start-item { padding: 9px 10px; border-bottom: 1px solid rgba(62,95,126,0.4); cursor: pointer; }
    .start-item:hover { background: rgba(88,130,168,0.15); }

    .window {
      position: absolute;
      width: 560px;
      height: 360px;
      background: #091522;
      border: 1px solid #35587b;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      z-index: 10;
      min-width: 280px;
      min-height: 200px;
    }

    .titlebar {
      height: 30px;
      background: linear-gradient(180deg, #1d3a57, #132b40);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      cursor: move;
      border-bottom: 1px solid #2d4f70;
      font-size: 12px;
    }

    .win-controls button { margin-left: 4px; width: 22px; height: 22px; border: 1px solid #45688a; background: #11283b; color: #d1e4f4; cursor: pointer; }
    .content { flex: 1; overflow: auto; padding: 10px; font-size: 13px; }

    .explorer-layout { display: grid; grid-template-columns: 200px 1fr; gap: 10px; height: 100%; }
    .tree, .file-view { border: 1px solid #284764; padding: 8px; background: rgba(3,10,16,0.35); overflow: auto; }
    .tree-item, .file-item { padding: 3px 6px; cursor: pointer; }
    .tree-item:hover, .file-item:hover { background: rgba(112,154,191,0.2); }
    .selected { background: rgba(112,154,191,0.35); }
    .muted { color: var(--muted); }
    .danger { color: var(--danger); }

    .terminal {
      background: #000;
      color: #98ca89;
      font-family: var(--mono);
      font-size: 13px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .terminal-output { flex: 1; overflow: auto; white-space: pre-wrap; padding: 6px; }
    .terminal-input { display: flex; border-top: 1px solid #1f3f1c; }
    .terminal-input span { padding: 5px; }
    .terminal-input input { flex: 1; background: #000; border: 0; color: #98ca89; font-family: var(--mono); padding: 5px; outline: none; }

    textarea {
      width: 100%;
      height: calc(100% - 10px);
      resize: none;
      background: #06131f;
      color: #ccdaea;
      border: 1px solid #2d4f6f;
      font-family: var(--mono);
      padding: 8px;
    }

    .notice { margin-top: 8px; font-size: 12px; color: #90a4ba; }

    .objective-panel {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 270px;
      z-index: 20;
      border: 1px solid #2d4f6f;
      background: rgba(4, 13, 21, 0.84);
      box-shadow: var(--shadow);
      padding: 10px;
      font-size: 12px;
      line-height: 1.4;
    }

    .objective-title {
      color: #cfe2f2;
      font-size: 13px;
      margin-bottom: 6px;
      letter-spacing: 0.6px;
    }

    .objective-subtitle {
      color: var(--warning);
      text-transform: uppercase;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .objective-panel ul {
      margin: 0;
      padding-left: 16px;
      color: #b7cce2;
    }
    .err { color: var(--danger); }

    .input-locked * {
      cursor: wait !important;
    }

    .cinematic-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 7, 12, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d6e5f3;
      text-shadow: 0 0 14px rgba(120, 170, 220, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      z-index: 60;
    }

    .cinematic-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    #desktopRoot.fx-flicker {
      animation: screen-flicker 0.12s steps(2, end) infinite;
    }

    #desktopRoot.fx-scanline-shift::before {
      background-size: 100% 2px;
      opacity: 0.4;
      animation: scanline-shift 0.18s linear infinite;
    }

    .taskbar.fx-warning-pulse {
      animation: taskbar-warning 0.32s ease-in-out infinite;
    }

    @keyframes screen-flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.82; }
    }

    @keyframes scanline-shift {
      0% { transform: translateY(0); }
      100% { transform: translateY(3px); }
    }

    @keyframes taskbar-warning {
      0%, 100% { box-shadow: inset 0 0 0 rgba(212, 98, 98, 0); }
      50% { box-shadow: inset 0 0 32px rgba(212, 98, 98, 0.42); }
    }

  </style>
</head>
<body>
  <section id="boot" class="scanline"><pre id="bootText"></pre></section>
  <section id="splash" class="scanline">
    <h1>EIDOLON OS</h1>
    <p>Version 3.1.4 — Presence Persists</p>
  </section>
  <section id="login" class="scanline">
    <div class="card">
      <div style="font-size:16px; margin-bottom:8px;">Recovered Session</div>
      <div><strong>User:</strong> operator</div>
      <div class="notice" id="lastSession"></div>
      <button id="loginBtn">Continue Session</button>
    </div>
  </section>

  <main id="desktopRoot" class="scanline">
    <div class="desktop-icons" id="desktopIcons"></div>

    <div class="start-menu" id="startMenu"></div>

    <div id="cinematicOverlay" class="cinematic-overlay"></div>

    <div class="taskbar">
      <button class="start-btn" id="startBtn">Start</button>
      <div class="tasklist" id="taskList"></div>
      <div class="tray">
        <span id="trayState">SYS: DEGRADED</span>
        <span id="trayClock"></span>
      </div>
    </div>
  </main>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
